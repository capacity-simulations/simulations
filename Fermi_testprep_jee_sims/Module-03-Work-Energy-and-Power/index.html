<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Work, Energy and Power — JEE Simulations</title>
  <meta name="description" content="Work as area under a force curve, the work–energy theorem, potential-energy curves, and elastic vs inelastic collisions." />
  <style>
    :root {
      --bg: #070914;
      --text: #eef2ff;
      --muted: rgba(203, 213, 255, 0.72);

      --accent: #7c3aed;     /* violet */
      --accent-2: #22d3ee;   /* cyan */
      --accent-3: #a3ffbd;   /* mint */

      --card: rgba(255, 255, 255, 0.055);
      --card-2: rgba(255, 255, 255, 0.085);
      --stroke: rgba(255, 255, 255, 0.10);
      --stroke-2: rgba(255, 255, 255, 0.16);

      --shadow: 0 18px 60px rgba(0,0,0,0.55);
      --shadow-soft: 0 12px 40px rgba(0,0,0,0.45);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: #070914;
      background-image:
        radial-gradient(1100px 650px at 15% -10%, rgba(124, 58, 237, 0.44) 0%, rgba(124, 58, 237, 0.0) 58%),
        radial-gradient(900px 520px at 96% 0%, rgba(34, 211, 238, 0.34) 0%, rgba(34, 211, 238, 0.0) 55%),
        radial-gradient(900px 520px at 60% 110%, rgba(163, 255, 189, 0.16) 0%, rgba(163, 255, 189, 0.0) 55%),
        linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.0) 40%),
        radial-gradient(1200px 700px at 20% 0%, rgba(23, 33, 74, 0.75) 0%, rgba(7, 9, 20, 1) 62%);
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: clamp(16px, 3vw, 40px);
      min-height: 100vh;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: radial-gradient(ellipse 70% 55% at 50% 20%, black 20%, transparent 76%);
      opacity: 0.55;
    }
    .wrap {
      width: 100%;
      max-width: 1040px;
      position: relative;
      z-index: 1;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.92rem;
      margin-bottom: 22px;
      transition: color 0.18s ease;
    }
    .back:hover { color: var(--text); }
    header {
      text-align: center;
      margin-bottom: 8px;
    }
    h1 {
      margin: 0 0 12px;
      font-weight: 850;
      letter-spacing: -0.02em;
      font-size: clamp(1.7rem, 4.8vw, 2.45rem);
      line-height: 1.1;
    }
    p.lead {
      margin: 0 auto;
      max-width: 620px;
      color: var(--muted);
      font-size: 1.05rem;
    }
    .search {
      width: min(420px, 100%);
      margin: 14px auto 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow-soft);
    }
    .search input {
      width: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
    }
    .search input::placeholder { color: rgba(238, 242, 255, 0.55); }
    .search:focus-within {
      border-color: rgba(34, 211, 238, 0.52);
      box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.14), var(--shadow-soft);
    }
    .search-empty {
      display: none;
      text-align: center;
      color: var(--muted);
      margin-top: 22px;
      font-size: 0.95rem;
    }
    .search-empty.show { display: block; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 36px;
    }
    .card {
      position: relative;
      background:
        radial-gradient(900px 260px at 20% 0%, rgba(124, 58, 237, 0.22), transparent 55%),
        radial-gradient(900px 260px at 90% 0%, rgba(34, 211, 238, 0.16), transparent 55%),
        linear-gradient(180deg, var(--card-2) 0%, var(--card) 100%);
      border: 1px solid var(--stroke);
      border-radius: 22px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 200px;
      box-shadow: var(--shadow-soft);
      transition: transform 0.18s ease, box-shadow 0.22s ease, border-color 0.2s ease, filter 0.22s ease;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.0) 35%);
      opacity: 0.8;
      pointer-events: none;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
      border-color: var(--stroke-2);
      filter: saturate(1.08);
    }
    .lecture-tag {
      position: relative;
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(34, 211, 238, 0.95);
      background: rgba(34, 211, 238, 0.12);
      border: 1px solid rgba(34, 211, 238, 0.22);
      padding: 3px 9px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    .card h3 {
      font-size: 1.16rem;
      margin: 0 0 10px;
      position: relative;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }
    .card p {
      color: var(--muted);
      margin: 0 0 18px;
      line-height: 1.45;
      font-size: 0.94rem;
    }
    .actions { margin-top: auto; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      background: var(--accent-2);
      color: rgba(7, 9, 20, 0.92);
      font-weight: 800;
      padding: 11px 17px;
      border-radius: 999px;
      border: 0;
      cursor: pointer;
      transition: transform 0.06s ease-in-out, filter 0.18s ease, box-shadow 0.18s ease;
      user-select: none;
      box-shadow: 0 14px 28px rgba(0,0,0,0.35);
    }
    .btn:hover {
      filter: brightness(1.06) saturate(1.06);
      box-shadow: 0 18px 34px rgba(0,0,0,0.42);
    }
    .btn:active { transform: translateY(1px) scale(0.99); }
    footer {
      text-align: center;
      margin-top: 40px;
      color: #a3b2ff88;
      font-size: 0.9rem;
    }
    @media (prefers-reduced-motion: no-preference) {
      .card { will-change: transform; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="../">← All JEE modules</a>
    <header>
      <h1>Work, Energy and Power — JEE Simulations</h1>
      <p class="lead">Work as area under a force curve, the work–energy theorem, potential-energy curves, and elastic vs inelastic collisions.</p>
    </header>

    <div class="search">
      <input id="sim-search" type="search" placeholder="Search Work, Energy and Power sims…" autocomplete="off" spellcheck="false"
             aria-label="Search simulations in this module" />
    </div>


    <section class="grid" id="grid"></section>
    <p class="search-empty" id="searchEmpty">No simulations match that search.</p>

    <footer>
      <span>© <span id="year"></span> • GitHub Pages</span>
    </footer>
  </main>

  <script>
    const items = [
      {
            "tag": "C046",
            "title": "Work–Energy Theorem: Area IS Energy",
            "desc": "The area under the F–x graph IS the kinetic energy gained — one number, drawn two ways.",
            "href": "./C046-work-energy-theorem.html",
            "cta": "Open simulation →"
      },
      {
            "tag": "C051",
            "title": "Conservation of Energy — the Total That Refuses to Move",
            "desc": "The speed at the bottom depends only on the HEIGHT dropped — never on the shape of the track.",
            "href": "./C051-conservation-of-mechanical-energy.html",
            "cta": "Open simulation →"
      },
      {
            "tag": "C053",
            "title": "Motion in a Potential — Bound, Free, or Balanced on the Edge",
            "desc": "The height of the total-energy line E relative to the barrier top Vb — not the local slope — decides the fate of the motion: bound oscillation (E &lt; Vb), escape (E &gt; Vb), or the separatrix (E = Vb), where the time to reach the unstable maximum diverges.",
            "href": "./C053-potential-energy-curves-and-equilibrium-stable-unstable.html",
            "cta": "Open simulation →"
      },
      {
            "tag": "C054",
            "title": "Collisions — Momentum &amp; Energy",
            "desc": "Momentum Σmv is conserved in EVERY collision; kinetic energy is conserved only in elastic ones — the lost KE becomes heat and deformation.",
            "href": "./C054-elastic-and-inelastic-collisions-in-1d--momentum-and-energy.html",
            "cta": "Open simulation →"
      },
      {
            "tag": "C054",
            "title": "Collisions in 1D",
            "desc": "Conservation of momentum: Σp = Σmᵢvᵢ is unchanged by every ball–ball collision, whatever the masses or elasticity. Kinetic energy is conserved only when e = 100%.",
            "href": "./C054-elastic-and-inelastic-collisions-in-1d.html",
            "cta": "Open simulation →"
      },
      {
            "tag": "C055",
            "title": "Glancing Collision — Two Unknowns, One Law Each",
            "desc": "Momentum in 2D is two equations; with elastic energy that's three — one short of fixing the outcome. The missing piece is how off-centre the hit was.",
            "href": "./C055-collisions-in-2d-and-coefficient-of-restitution.html",
            "cta": "Open simulation →"
      }
];

    const grid = document.getElementById('grid');
    items.forEach(it => {
      const card = document.createElement('article');
      card.className = 'card';
      card.dataset.search = ((it.title || '') + ' ' + (it.desc || '') + ' ' + (it.tag || '')).toLowerCase();
      card.innerHTML = `
        <div>
          ${it.tag ? '<span class="lecture-tag">' + it.tag + '</span>' : ''}
          <h3>${it.title}</h3>
          <p>${it.desc}</p>
        </div>
        <div class="actions">
          <a class="btn" href="${it.href}">${it.cta}</a>
        </div>
      `;
      grid.appendChild(card);
    });


    /* Search: filters this module's cards on title + description. Card markup is
       built above, so data-search is stamped there; this only reads it. */
    (function () {
      var input = document.getElementById('sim-search');
      var grid = document.getElementById('grid');
      var empty = document.getElementById('searchEmpty');
      if (!input || !grid) return;
      input.addEventListener('input', function () {
        var q = input.value.trim().toLowerCase();
        var shown = 0;
        grid.querySelectorAll('.card').forEach(function (card) {
          var hit = !q || (card.dataset.search || '').indexOf(q) !== -1;
          card.style.display = hit ? '' : 'none';
          if (hit) shown++;
        });
        if (empty) empty.classList.toggle('show', shown === 0);
      });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { input.value = ''; input.dispatchEvent(new Event('input')); }
      });
    })();

    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
