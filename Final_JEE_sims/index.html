<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Testprep — JEE Physics Simulations</title>
  <meta name="description" content="102 interactive simulations across the complete JEE physics syllabus, grouped into 14 modules from kinematics to modern physics." />
  <style>
    :root {
      --bg: #070914;
      --text: #eef2ff;
      --muted: rgba(203, 213, 255, 0.72);

      --accent: #7c3aed;     /* violet */
      --accent-2: #22d3ee;   /* cyan */
      --accent-3: #a3ffbd;   /* mint */

      --card: rgba(255, 255, 255, 0.055);
      --card-2: rgba(255, 255, 255, 0.085);
      --stroke: rgba(255, 255, 255, 0.10);
      --stroke-2: rgba(255, 255, 255, 0.16);

      --shadow: 0 18px 60px rgba(0,0,0,0.55);
      --shadow-soft: 0 12px 40px rgba(0,0,0,0.45);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: #070914;
      background-image:
        radial-gradient(1100px 650px at 15% -10%, rgba(124, 58, 237, 0.44) 0%, rgba(124, 58, 237, 0.0) 58%),
        radial-gradient(900px 520px at 96% 0%, rgba(34, 211, 238, 0.34) 0%, rgba(34, 211, 238, 0.0) 55%),
        radial-gradient(900px 520px at 60% 110%, rgba(163, 255, 189, 0.16) 0%, rgba(163, 255, 189, 0.0) 55%),
        linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.0) 40%),
        radial-gradient(1200px 700px at 20% 0%, rgba(23, 33, 74, 0.75) 0%, rgba(7, 9, 20, 1) 62%);
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: clamp(16px, 3vw, 40px);
      min-height: 100vh;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: radial-gradient(ellipse 70% 55% at 50% 20%, black 20%, transparent 76%);
      opacity: 0.55;
    }
    .wrap {
      width: 100%;
      max-width: 1040px;
      position: relative;
      z-index: 1;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.92rem;
      margin-bottom: 22px;
      transition: color 0.18s ease;
    }
    .back:hover { color: var(--text); }
    header {
      text-align: center;
      margin-bottom: 8px;
    }
    h1 {
      margin: 0 0 12px;
      font-weight: 850;
      letter-spacing: -0.02em;
      font-size: clamp(1.7rem, 4.8vw, 2.45rem);
      line-height: 1.1;
    }
    p.lead {
      margin: 0 auto;
      max-width: 620px;
      color: var(--muted);
      font-size: 1.05rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 36px;
    }
    .card {
      position: relative;
      background:
        radial-gradient(900px 260px at 20% 0%, rgba(124, 58, 237, 0.22), transparent 55%),
        radial-gradient(900px 260px at 90% 0%, rgba(34, 211, 238, 0.16), transparent 55%),
        linear-gradient(180deg, var(--card-2) 0%, var(--card) 100%);
      border: 1px solid var(--stroke);
      border-radius: 22px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 200px;
      box-shadow: var(--shadow-soft);
      transition: transform 0.18s ease, box-shadow 0.22s ease, border-color 0.2s ease, filter 0.22s ease;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.0) 35%);
      opacity: 0.8;
      pointer-events: none;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
      border-color: var(--stroke-2);
      filter: saturate(1.08);
    }
    .lecture-tag {
      position: relative;
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(34, 211, 238, 0.95);
      background: rgba(34, 211, 238, 0.12);
      border: 1px solid rgba(34, 211, 238, 0.22);
      padding: 3px 9px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    .card h3 {
      font-size: 1.16rem;
      margin: 0 0 10px;
      position: relative;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }
    .card p {
      color: var(--muted);
      margin: 0 0 18px;
      line-height: 1.45;
      font-size: 0.94rem;
    }
    .actions { margin-top: auto; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      background: var(--accent-2);
      color: rgba(7, 9, 20, 0.92);
      font-weight: 800;
      padding: 11px 17px;
      border-radius: 999px;
      border: 0;
      cursor: pointer;
      transition: transform 0.06s ease-in-out, filter 0.18s ease, box-shadow 0.18s ease;
      user-select: none;
      box-shadow: 0 14px 28px rgba(0,0,0,0.35);
    }
    .btn:hover {
      filter: brightness(1.06) saturate(1.06);
      box-shadow: 0 18px 34px rgba(0,0,0,0.42);
    }
    .btn:active { transform: translateY(1px) scale(0.99); }
    footer {
      text-align: center;
      margin-top: 40px;
      color: #a3b2ff88;
      font-size: 0.9rem;
    }
    @media (prefers-reduced-motion: no-preference) {
      .card { will-change: transform; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="../">← All topics</a>
    <header>
      <h1>Testprep — JEE Physics Simulations</h1>
      <p class="lead">102 interactive simulations across the complete JEE physics syllabus, grouped into 14 modules from kinematics to modern physics.</p>
    </header>

    <section class="grid" id="grid"></section>

    <footer>
      <span>© <span id="year"></span> • GitHub Pages</span>
    </footer>
  </main>

  <script>
    const items = [
      {
            "tag": "Module 01 · 6 sims",
            "title": "Kinematics",
            "desc": "Describing motion before asking what causes it: the equations of uniform acceleration, reading x–t, v–t and a–t graphs as one motion differentiated twice, projectiles with independent x and y (and what air drag does to the 45° rule), and relative velocity in one and two dimensions.",
            "href": "./Module-01-Kinematics/",
            "cta": "Open module →"
      },
      {
            "tag": "Module 02 · 9 sims",
            "title": "Laws of Motion and Friction",
            "desc": "Newton's three laws and what they actually claim: force changes motion rather than sustaining it, action–reaction pairs act on different bodies, and free-body diagrams turn a picture into equations. Friction, banked turns, vertical circles and non-inertial frames follow.",
            "href": "./Module-02-Laws-of-Motion-and-Friction/",
            "cta": "Open module →"
      },
      {
            "tag": "Module 03 · 6 sims",
            "title": "Work, Energy and Power",
            "desc": "Energy as bookkeeping: the area under a force–displacement curve IS the work, the work–energy theorem links it to Δ½mv², and potential-energy curves classify motion as bound, free or balanced on the edge. Elastic and inelastic collisions close the module.",
            "href": "./Module-03-Work-Energy-and-Power/",
            "cta": "Open module →"
      },
      {
            "tag": "Module 04 · 8 sims",
            "title": "Centre of Mass, Momentum and Rotation",
            "desc": "From impulse–momentum to rigid bodies: where the mass sits sets the moment of inertia, the parallel-axis theorem prices a shifted axis, and rolling without slipping splits kinetic energy by shape alone. Equilibrium needs two conditions, not one.",
            "href": "./Module-04-Centre-of-Mass-Momentum-and-Rotation/",
            "cta": "Open module →"
      },
      {
            "tag": "Module 05 · 6 sims",
            "title": "Gravitation",
            "desc": "Newtonian gravity from orbits outward: escape and orbital velocity, why climbing higher means going slower, the single altitude that stands still over the equator, and Kepler's three laws recovered from the inverse-square force — including all four conic-section trajectories.",
            "href": "./Module-05-Gravitation/",
            "cta": "Open module →"
      },
      {
            "tag": "Module 06 · 7 sims",
            "title": "Properties of Matter and Thermal Physics",
            "desc": "Fluids and heat: buoyancy and apparent weight, the Venturi narrowing, and terminal velocity when drag balances weight. Then thermal expansion (the hole grows too), latent heat on a heating curve, steady-state conduction, and the black-body curve that carries three laws at once.",
            "href": "./Module-06-Properties-of-Matter-and-Thermal/",
            "cta": "Open module →"
      },
      {
            "tag": "Module 07 · 5 sims",
            "title": "Kinetic Theory and Thermodynamics",
            "desc": "The gas from the molecules up: the ideal-gas laws, the three characteristic speeds of one Maxwell distribution, and how counting degrees of freedom fixes γ. Then the first law across four processes, and the Carnot ceiling no engine can beat.",
            "href": "./Module-07-Kinetic-Theory-and-Thermodynamics/",
            "cta": "Open module →"
      },
      {
            "tag": "Module 08 · 10 sims",
            "title": "Oscillations and Waves",
            "desc": "Simple harmonic motion and what breaks it: amplitude-independent period, springs in series and parallel, the nonlinear pendulum where the textbook formula fails, damping regimes and driven resonance. Waves follow — superposition, standing waves, pipes, beats and Doppler.",
            "href": "./Module-08-Oscillations-and-Waves/",
            "cta": "Open module →"
      },
      {
            "tag": "Module 09 · 9 sims",
            "title": "Electrostatics",
            "desc": "Charges, fields and potential: Coulomb's law, field lines traced from the field itself, the dipole that almost cancels, and Gauss's law relating flux to enclosed charge. Then E = −dV/dr, equipotentials always perpendicular to E, and capacitors with and without a dielectric.",
            "href": "./Module-09-Electrostatics/",
            "cta": "Open module →"
      },
      {
            "tag": "Module 10 · 6 sims",
            "title": "Current Electricity",
            "desc": "What actually moves in a wire: drift velocity as a bias in the average, Ohm's law, and why adding a resistor in parallel lowers the total resistance. Real cells sag under load through internal resistance; Kirchhoff's rules and the RC time constant complete the toolkit.",
            "href": "./Module-10-Current-Electricity/",
            "cta": "Open module →"
      },
      {
            "tag": "Module 11 · 5 sims",
            "title": "Magnetic Effects and Magnetism",
            "desc": "Magnetic force and its sources: circular motion whose period ignores the speed (and the cyclotron built on that fact), F = BIL sin θ defining the ampere, torque on a current loop, and how the field of a wire thins with distance while a solenoid's does not.",
            "href": "./Module-11-Magnetic-Effects-and-Magnetism/",
            "cta": "Open module →"
      },
      {
            "tag": "Module 12 · 8 sims",
            "title": "Electromagnetic Induction, AC and EM Waves",
            "desc": "Changing flux makes emf: Faraday's magnet and coil, motional emf and the push it costs, and inductors resisting change through LR growth and LC oscillation. AC follows — phase per element, the impedance triangle and power factor, series LCR resonance, then displacement current and the EM wave itself.",
            "href": "./Module-12-EMI-AC-and-EM-Waves/",
            "cta": "Open module →"
      },
      {
            "tag": "Module 13 · 10 sims",
            "title": "Optics",
            "desc": "Rays first, then waves: spherical mirrors, refraction and total internal reflection, thin lenses and the lens-maker's equation, prisms at minimum deviation, and the two-lens logic of telescope versus microscope. Then interference, single-slit diffraction, the resolution limit and Malus's law.",
            "href": "./Module-13-Optics/",
            "cta": "Open module →"
      },
      {
            "tag": "Module 14 · 7 sims",
            "title": "Modern Physics",
            "desc": "Where classical physics runs out: the photoelectric effect, de Broglie waves and why a cricket ball never diffracts, and the Geiger–Marsden experiment that found the nucleus. Then the Bohr atom, hydrogen's spectral series as jumps between levels, and radioactive decay as a law with no schedule.",
            "href": "./Module-14-Modern-Physics/",
            "cta": "Open module →"
      }
];

    const grid = document.getElementById('grid');
    items.forEach(it => {
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `
        <div>
          ${it.tag ? '<span class="lecture-tag">' + it.tag + '</span>' : ''}
          <h3>${it.title}</h3>
          <p>${it.desc}</p>
        </div>
        <div class="actions">
          <a class="btn" href="${it.href}">${it.cta}</a>
        </div>
      `;
      grid.appendChild(card);
    });

    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
