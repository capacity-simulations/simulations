<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Particle Physics — Interactive Simulations</title>
  <meta name="description" content="Interactive particle-physics simulations." />
  <style>
    :root {
      --bg: #070914;
      --text: #eef2ff;
      --muted: rgba(203, 213, 255, 0.72);

      --accent: #7c3aed;     /* violet */
      --accent-2: #22d3ee;   /* cyan */
      --accent-3: #a3ffbd;   /* mint */

      --card: rgba(255, 255, 255, 0.055);
      --card-2: rgba(255, 255, 255, 0.085);
      --stroke: rgba(255, 255, 255, 0.10);
      --stroke-2: rgba(255, 255, 255, 0.16);

      --shadow: 0 18px 60px rgba(0,0,0,0.55);
      --shadow-soft: 0 12px 40px rgba(0,0,0,0.45);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: #070914;
      background-image:
        radial-gradient(1100px 650px at 15% -10%, rgba(124, 58, 237, 0.44) 0%, rgba(124, 58, 237, 0.0) 58%),
        radial-gradient(900px 520px at 96% 0%, rgba(34, 211, 238, 0.34) 0%, rgba(34, 211, 238, 0.0) 55%),
        radial-gradient(900px 520px at 60% 110%, rgba(163, 255, 189, 0.16) 0%, rgba(163, 255, 189, 0.0) 55%),
        linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.0) 40%),
        radial-gradient(1200px 700px at 20% 0%, rgba(23, 33, 74, 0.75) 0%, rgba(7, 9, 20, 1) 62%);
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: clamp(16px, 3vw, 40px);
      min-height: 100vh;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: radial-gradient(ellipse 70% 55% at 50% 20%, black 20%, transparent 76%);
      opacity: 0.55;
    }
    .wrap {
      width: 100%;
      max-width: 1040px;
      position: relative;
      z-index: 1;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.92rem;
      margin-bottom: 22px;
      transition: color 0.18s ease;
    }
    .back:hover { color: var(--text); }
    header {
      text-align: center;
      margin-bottom: 8px;
    }
    h1 {
      margin: 0 0 12px;
      font-weight: 850;
      letter-spacing: -0.02em;
      font-size: clamp(1.7rem, 4.8vw, 2.45rem);
      line-height: 1.1;
    }
    p.lead {
      margin: 0 auto;
      max-width: 620px;
      color: var(--muted);
      font-size: 1.05rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 36px;
    }
    .card {
      position: relative;
      background:
        radial-gradient(900px 260px at 20% 0%, rgba(124, 58, 237, 0.22), transparent 55%),
        radial-gradient(900px 260px at 90% 0%, rgba(34, 211, 238, 0.16), transparent 55%),
        linear-gradient(180deg, var(--card-2) 0%, var(--card) 100%);
      border: 1px solid var(--stroke);
      border-radius: 22px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 200px;
      box-shadow: var(--shadow-soft);
      transition: transform 0.18s ease, box-shadow 0.22s ease, border-color 0.2s ease, filter 0.22s ease;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.0) 35%);
      opacity: 0.8;
      pointer-events: none;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
      border-color: var(--stroke-2);
      filter: saturate(1.08);
    }
    .lecture-tag {
      position: relative;
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(34, 211, 238, 0.95);
      background: rgba(34, 211, 238, 0.12);
      border: 1px solid rgba(34, 211, 238, 0.22);
      padding: 3px 9px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    .card h3 {
      font-size: 1.16rem;
      margin: 0 0 10px;
      position: relative;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }
    .card p {
      color: var(--muted);
      margin: 0 0 18px;
      line-height: 1.45;
      font-size: 0.94rem;
    }
    .actions { margin-top: auto; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      background: var(--accent-2);
      color: rgba(7, 9, 20, 0.92);
      font-weight: 800;
      padding: 11px 17px;
      border-radius: 999px;
      border: 0;
      cursor: pointer;
      transition: transform 0.06s ease-in-out, filter 0.18s ease, box-shadow 0.18s ease;
      user-select: none;
      box-shadow: 0 14px 28px rgba(0,0,0,0.35);
    }
    .btn:hover {
      filter: brightness(1.06) saturate(1.06);
      box-shadow: 0 18px 34px rgba(0,0,0,0.42);
    }
    .btn:active { transform: translateY(1px) scale(0.99); }
    footer {
      text-align: center;
      margin-top: 40px;
      color: #a3b2ff88;
      font-size: 0.9rem;
    }
    @media (prefers-reduced-motion: no-preference) {
      .card { will-change: transform; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="../../">← All topics</a>
    <header>
      <h1>Particle Physics</h1>
      <p class="lead">From the Standard Model to the death of parity — scattering, antimatter, quarks, and symmetry through interactive, guided simulations.</p>
    </header>

    <section class="grid" id="grid"></section>

    <footer>
      <span>© <span id="year"></span> • GitHub Pages</span>
    </footer>
  </main>

  <script>
    const sims = [
      { file: "exploring-the-standard-model.html", lecture: "Lecture 1", title: "Exploring the Standard Model", desc: "Click any of the 17 tiles for mass, charge, spin, and discovery story — then unfold the one-line Standard Model Lagrangian term by term." },
      { file: "scale-of-the-universe.html", lecture: "Lecture 2", title: "Scale of the Universe", desc: "Zoom from a human down to the quark scale and watch the probe energy climb as E = ħc/d — why seeing smaller always costs more." },
      { file: "geiger-marsden-gold-foil-experiment.html", lecture: "Lectures 3–4", title: "Geiger–Marsden Gold Foil Experiment", desc: "Fire α particles at gold foil and count the rare bounce-backs — plum pudding versus the nuclear atom, ending at the size of the nucleus." },
      { file: "spin-and-helicity.html", lecture: "Lectures 8–9", title: "Spin and Helicity", desc: "Chase and overtake a spinning electron: helicity flips at β = p/E while boost-invariant chirality doesn't — until the massless limit fuses the two." },
      { file: "dirac-s-sea-of-electrons.html", lecture: "Lecture 10", title: "Dirac's Sea of Electrons", desc: "Every negative-energy state is already filled: pay 2E(p) ≥ 1.022 MeV to lift an electron out, and watch the hole drift like a positron." },
      { file: "virtual-cloud-chamber.html", lecture: "Lecture 10", title: "Virtual Cloud Chamber", desc: "Read charge, mass, and direction from curved tracks (r = p/qB) — and re-run Anderson's 1932 lead-plate discovery of the positron." },
      { file: "how-to-make-a-particle.html", lecture: "Lecture 11", title: "How To Make a Particle", desc: "Turn a photon into matter: pair creation switches on at Eγ = 2mc², the surplus becomes kinetic energy, and PET runs the process in reverse." },
      { file: "feynman-diagram-sandbox.html", lecture: "Lecture 12", title: "Feynman Diagram Sandbox", desc: "Build e⁺e⁻ annihilation diagrams vertex by vertex — invalid vertices get flagged, thresholds bite, and the cross-section falls as 1/s." },
      { file: "navigating-the-eight-fold-way.html", lecture: "Lecture 14", title: "Navigating the Eight-Fold Way", desc: "Arrange baryons by charge and strangeness until one corner stays empty — the gap that predicted the Ω⁻ two years before it was found." },
      { file: "build-a-baryon.html", lecture: "Lecture 14", title: "Build-A-Baryon", desc: "Click quarks into slots and fuse hadrons — colour makes uuu legal, the strangeness ladder predicts the Ω⁻, and 'not yet observed' ≠ 'impossible'." },
      { file: "wu-experiment-and-the-death-of-parity.html", lecture: "Lecture 17", title: "Wu Experiment and the Death of Parity", desc: "Cool ⁶⁰Co in a magnetic field, fire decays, and hold up a mirror: the electrons' preferred direction kills parity conservation." },
      { file: "the-wine-bottle-potential-continuous-symmetr.html", lecture: "Lecture 19", title: "The Wine Bottle Potential", desc: "Roll a field around the wine-bottle potential: the vacuum picks a point on the ring, the radial mode is massive, and the ring direction is Goldstone's massless mode." },
      { file: "virtual-particle-collider.html", lecture: "Special", title: "Virtual Particle Collider", desc: "Tune beam energies and luminosity: √s ≥ 2m opens each pair channel while σ ∝ 1/s taxes the rate — reach versus statistics." },
      { file: "particle-detector-headquarters.html", lecture: "Toolkit", title: "Particle Detector Headquarters", desc: "Identify particles by where they deposit energy in a layered ATLAS-style detector — and separate identical tracks by mass with TOF and Cherenkov." },
    ];

    const grid = document.getElementById('grid');
    sims.forEach(sim => {
      const card = document.createElement('article');
      card.className = 'card';
      const viewerHref = './viewer.html?sim=' + encodeURIComponent(sim.file) +
                         '&title=' + encodeURIComponent(sim.title);
      card.innerHTML = `
        <div>
          <span class="lecture-tag">${sim.lecture}</span>
          <h3>${sim.title}</h3>
          <p>${sim.desc}</p>
        </div>
        <div class="actions">
          <a class="btn" href="${viewerHref}">Open simulation →</a>
        </div>
      `;
      grid.appendChild(card);
    });

    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
