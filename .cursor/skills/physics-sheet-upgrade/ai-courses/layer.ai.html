<!-- ==========================================================================
     THE PHYSICS LAYER — pop-up revision sheet (AI-course variant).
     Installed in place of the PHYSICS_SHEET marker comment; touches nothing else.
     The shell's "⚛︎ The Physics" button already calls window.__openPhysics().
     Equations: LaTeX (Computer Modern) as inline SVG paths. Diagrams: TikZ,
     computed from the sim's defaults. Theme-aware via currentColor. Offline-safe.

     ZONES:
       MACHINERY (keep verbatim across sims): all CSS; in the JS everything outside
       the single PER-SIM block.
       PER-SIM: everything inside the phys-art article, the aria-label / kicker,
       the EQn / Dn asset tokens, and the PER-SIM block in the script.
     ========================================================================== -->
<style>
#phys-backdrop{position:fixed;inset:0;background:rgba(4,6,10,.78);backdrop-filter:blur(3px);
  z-index:6200;display:none;align-items:flex-start;justify-content:center;padding:64px 22px 26px;}
#phys-backdrop.open{display:flex;}
.phys-modal{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;
  width:min(920px,96vw);max-height:calc(100vh - 100px);display:flex;flex-direction:column;
  box-shadow:0 24px 64px rgba(0,0,0,.55);color:var(--text);font-family:var(--font-sans);}
.phys-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;
  padding:26px 28px 16px;border-bottom:1px solid var(--line);flex-shrink:0;}
.phys-title{flex:1;min-width:220px;}
.phys-title h2{margin:0;font:700 26px/1.1 'STIX Two Text',Georgia,'Times New Roman',serif;color:var(--text);}
.phys-title .phys-kicker{margin:6px 0 0;font-size:12px;color:var(--ink-mute);}
#phys-download{white-space:nowrap;}
.phys-body{padding:18px 28px 30px;overflow-y:auto;}
.phys-art{max-width:720px;margin:0 auto;}
.phys-art .lede{margin:2px 0 14px;padding:13px 16px;border:1px solid var(--accent-soft);border-left:3px solid var(--accent);
  border-radius:0 11px 11px 0;background:var(--surface-soft);
  font:italic 500 16px/1.5 'STIX Two Text',Georgia,serif;color:var(--ink-mid);}
.phys-art .ch{display:grid;grid-template-columns:40px 1fr;gap:0 14px;padding:16px 18px 15px;margin:14px 0;
  border:1px solid var(--line);border-radius:11px;background:var(--surface-soft);}
.phys-art .ch .no{font:600 20px/1.15 'STIX Two Text',Georgia,serif;color:var(--accent);padding-top:3px;}
.phys-art .ch h3{margin:0 0 12px;padding-bottom:9px;border-bottom:1px solid var(--line);
  font:600 18px/1.3 'STIX Two Text',Georgia,serif;color:var(--text);}
.phys-art .pts{margin:8px 0 0;padding-left:17px;font-size:13px;line-height:1.6;color:var(--ink-mid);}
.phys-art .pts li{margin:5px 0;}
.phys-art .pts b,.phys-art .pts i{color:var(--text);}
.phys-art .board{border-left:3px solid var(--accent);background:rgba(59,155,143,.08);
  border-radius:0 8px 8px 0;padding:12px 14px 10px;margin:10px 0;overflow-x:auto;color:var(--text);}
.phys-art .board svg{display:block;}
.phys-art .board .cap,.phys-art .fig .cap{font-size:11.5px;color:var(--ink-mute);margin-top:8px;}
.phys-art .fig{margin:12px 0 6px;padding:12px 10px 9px;border:1px solid var(--line);border-radius:9px;
  color:var(--text);text-align:center;}
.phys-art .fig svg{width:100%;height:auto;display:inline-block;}
.phys-art .fig.f1 svg{max-width:440px;}
.phys-art .fig.f2 svg{max-width:360px;}
.phys-art .fig.f3 svg{max-width:400px;}
.phys-art .seesim{margin:12px 8px 0 0;}
.phys-art .live-panel{border:1px solid var(--accent);border-radius:10px;padding:12px 14px;margin:10px 0;
  background:linear-gradient(180deg,rgba(59,155,143,.10),transparent 70%);}
.phys-art .live-num{font-family:var(--font-nums);font-size:17px;color:var(--text);line-height:1.45;}
.phys-art .live-num b{color:var(--accent);font-weight:700;}
.phys-art .live-sub{font-family:var(--font-nums);font-size:12px;color:var(--ink-mute);margin-top:2px;}
.phys-mini{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;
  font-size:12px;color:var(--ink-mid);max-width:460px;margin-top:9px;}
.phys-mini input[type=range]{width:100%;accent-color:var(--accent);margin:0;}
.phys-mini select{font:inherit;font-size:12px;background:var(--ctrl-bg);color:var(--text);border:1px solid var(--ctrl-border);border-radius:6px;padding:3px 6px;}
.phys-mini input[type=checkbox]{accent-color:var(--accent);justify-self:start;margin:0;}
.phys-chips{display:flex;flex-wrap:wrap;gap:4px;}
.phys-chip{font:inherit;font-size:11.5px;padding:3px 8px;border-radius:6px;cursor:pointer;
  background:var(--ctrl-bg);color:var(--text);border:1px solid var(--ctrl-border);}
.phys-chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.phys-mini .mv{font-family:var(--font-nums);color:var(--text);min-width:84px;text-align:right;}
.phys-art .live-hint{font-size:11.5px;color:var(--ink-mute);margin:8px 0 0;}
.phys-art .phys-q{border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--ink-mid);}
.phys-art .phys-q+.phys-q{margin-top:8px;}
.phys-art .phys-q summary{cursor:pointer;color:var(--text);font-weight:600;}
.phys-art .phys-q[open]{border-color:var(--accent-soft);}
.phys-art .phys-q .ans{margin:7px 0 0;line-height:1.55;}
.phys-gi-note{margin:0 0 16px;padding:10px 14px;border:1px solid rgba(127,127,127,.38);border-radius:10px;
  background:rgba(127,127,127,.09);font-size:13.5px;line-height:1.5;color:var(--text);}
#phys-toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:6300;
  max-width:min(560px,90vw);background:var(--panel-2);border:1px solid var(--accent-soft);
  border-left:3px solid var(--accent);border-radius:9px;padding:10px 14px;font-size:13px;
  line-height:1.45;color:var(--text);box-shadow:0 12px 32px rgba(0,0,0,.45);
  opacity:0;pointer-events:none;transition:opacity .25s;}
#phys-toast.show{opacity:1;}
@media(max-width:640px){.phys-art .ch{grid-template-columns:30px 1fr;gap:0 10px;}.phys-head{padding:20px 18px 14px;}.phys-body{padding:14px 16px 24px;}#phys-backdrop{padding:56px 8px 16px;}}
@media(prefers-reduced-motion:reduce){#phys-toast{transition:none;}}
</style>

<div id="phys-backdrop" data-no-reset role="dialog" aria-modal="true" aria-label="The Physics — revision sheet for {{TOPIC}}">
  <div class="phys-modal">
    <div class="phys-head">
      <div class="phys-title">
        <h2>The Physics</h2>
        <p class="phys-kicker">{{KICKER}}</p>
      </div>
      <button id="phys-download" class="shell-btn" title="Save this sheet as a standalone page — print to PDF from inside it">⬇ Download sheet</button>
      <button id="phys-close" class="shell-btn" title="Close (Esc)" aria-label="Close">✕</button>
    </div>
    <div class="phys-body">
      <div class="phys-gi-note" role="note" hidden><b>You’re partway through the Guided Inquiry.</b> This sheet talks through the answers, so the “See it in the sim” buttons are paused until you finish the inquiry or switch to Free Exploration.</div>
      <!-- ======== PER-SIM CONTENT (references/content.md + ai-courses/README.md):
           keep the class names and the ids phys-art / phys-live / phys-num /
           phys-sub / phys-mini / phys-worked. The live-panel ids are filled by JS. -->
      <article class="phys-art" id="phys-art">
{{ARTICLE}}
      </article>
    </div>
  </div>
</div>
<div id="phys-toast" data-no-reset></div>

<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id);};
  var backdrop=$('phys-backdrop'), toastEl=$('phys-toast'), art=$('phys-art');
  var wasPlaying=false, toastT=null;
  function fmt(x,d){ if(!isFinite(x)) return '—'; var s=(Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toFixed(d); return s.replace(/^-/,'−'); }
  function sci(x,d){ if(!isFinite(x)) return '—'; if(x===0) return '0'; var e=Math.floor(Math.log10(Math.abs(x))), m=x/Math.pow(10,e);
    if(Math.abs(fmt(m,d))>=10){ m/=10; e+=1; } return fmt(m,d)+'×10<sup>'+String(e).replace('-','−')+'</sup>'; }

  /* ===== PER-SIM ===== (everything a new sim needs is in this block) ==========
     TITLE   download <title> + saved-sheet subtitle.     FILE  download filename.
     MINI    mirrored controls — each drives the sim's OWN control and follows it back:
             {el:'<id>', sym, show}      an <input type=range>, <select> or <input type=checkbox>
                                         (range min/max/step and select options are copied, never drift)
             {group:'<css selector of the sim's option buttons>', key:'name', sym, show,
              value:function(btn){return btn.dataset.value;}}   a button group / segmented control
                                         (active = .active, .is-on, aria-pressed or aria-checked "true")
             {radio:'<input name>', key:'name', sym, show}       a radio group
             show(value) formats the readout beside the control.
     LIVE(v) v = {domId: value (number for ranges, string for selects, boolean for checkboxes),
                  key: value of the active button / checked radio (string)}.
             Return {num:'html', sub:'html', worked:'html', snap:'html'} computed with the
             SAME formulas the sim uses (pitfalls #6: never frozen defaults).
     SHOW(v) {key:{scene:{…keys the sim's __physicsHooks.scene understands…}, msg:'toast html'}}.
             Pass the CURRENT values of every control the scene resets (freeExplore resets them). */
  var TITLE='{{TITLE}}', FILE='the-physics-{{SLUG}}.html';
  var MINI=[];
  function LIVE(v){ return {num:'', sub:'', worked:'', snap:''}; }
  function SHOW(v){ return {}; }
  /* ===== END PER-SIM ===== */

  function mainEl(id){ return $(id); }
  function isOn(b){ return b.classList.contains('active')||b.classList.contains('is-on')
    ||b.getAttribute('aria-pressed')==='true'||b.getAttribute('aria-checked')==='true'; }
  function opts(m){ /* the sim's own option elements for a group / radio mirror */
    return Array.prototype.slice.call(m.group?document.querySelectorAll(m.group)
      :document.querySelectorAll('input[type=radio][name="'+m.radio+'"]'))
      .filter(function(e){ return !e.closest('#phys-backdrop'); });
  }
  function optVal(m,e){ return m.radio?e.value:(m.value?m.value(e):(e.dataset.value!=null?e.dataset.value:e.textContent.trim())); }
  function keyOf(m){ return m.el||m.key; }
  function readVals(){
    var v={};
    MINI.forEach(function(m){
      if(m.el){ var el=mainEl(m.el); if(!el) return;
        v[m.el]=el.type==='checkbox'?el.checked:(el.tagName==='SELECT'?el.value:parseFloat(el.value)); return; }
      var on=opts(m).filter(function(e){ return m.radio?e.checked:isOn(e); })[0];
      if(on) v[m.key]=optVal(m,on);
    });
    return v;
  }
  /* mirrored controls, built from the sim's own controls */
  var mini=$('phys-mini');
  if(mini) MINI.forEach(function(m){
    var lab=document.createElement('span'); lab.innerHTML=m.sym;
    var out=document.createElement('span'); out.className='mv'; out.id='phys-mv-'+keyOf(m);
    var ctl;
    if(m.el){
      var src=mainEl(m.el); if(!src) return;
      if(src.tagName==='SELECT'){ ctl=document.createElement('select'); ctl.innerHTML=src.innerHTML; }
      else if(src.type==='checkbox'){ ctl=document.createElement('input'); ctl.type='checkbox'; }
      else { ctl=document.createElement('input'); ctl.type='range'; ctl.min=src.min; ctl.max=src.max; ctl.step=src.step||'any'; }
      ctl.id='phys-m-'+m.el;
      ctl.addEventListener(ctl.tagName==='SELECT'||ctl.type==='checkbox'?'change':'input',function(){
        if(src.type==='checkbox'){ if(src.checked!==ctl.checked) src.click(); }
        else {
          src.value=ctl.value;
          src.dispatchEvent(new Event('input',{bubbles:true}));
          src.dispatchEvent(new Event('change',{bubbles:true}));
        }
        refreshLive();
      });
      src.addEventListener('input',refreshLive); src.addEventListener('change',refreshLive);
    } else {
      var list=opts(m); if(!list.length) return;
      ctl=document.createElement('span'); ctl.className='phys-chips'; ctl.id='phys-m-'+m.key; ctl.setAttribute('role','group');
      ctl.setAttribute('data-src', m.group?m.group:'input[type=radio][name="'+m.radio+'"]');
      list.forEach(function(e,i){
        var c=document.createElement('button'); c.type='button'; c.className='phys-chip'; c.setAttribute('data-i',i);
        c.textContent=m.radio?((e.labels&&e.labels[0]?e.labels[0].textContent:e.value).trim()):e.textContent.trim();
        c.addEventListener('click',function(){ var t=opts(m)[i]; if(t) t.click(); setTimeout(refreshLive,0); });
        ctl.appendChild(c);
        if(!m.radio&&window.MutationObserver) new MutationObserver(refreshLive).observe(e,{attributes:true,attributeFilter:['class','aria-pressed','aria-checked']});
        else e.addEventListener('change',refreshLive);
      });
    }
    ctl.setAttribute('aria-label',lab.textContent);
    mini.appendChild(lab); mini.appendChild(ctl); mini.appendChild(out);
  });
  function refreshLive(){
    var v=readVals();
    MINI.forEach(function(m){
      var k=keyOf(m), c=$('phys-m-'+k), o=$('phys-mv-'+k);
      if(m.el){ var src=mainEl(m.el); if(c&&src){ if(src.type==='checkbox') c.checked=src.checked; else c.value=src.value; } }
      else if(c){ var list=opts(m);
        Array.prototype.forEach.call(c.children,function(ch,i){ var e=list[i], on=!!e&&(m.radio?e.checked:isOn(e));
          ch.classList.toggle('on',on); ch.setAttribute('aria-pressed',on?'true':'false'); }); }
      if(o&&(k in v)) o.innerHTML=m.show?m.show(v[k]):String(v[k]);
    });
    var r=LIVE(v)||{};
    if($('phys-num')) $('phys-num').innerHTML=r.num||'';
    if($('phys-sub')) $('phys-sub').innerHTML=r.sub||'';
    if($('phys-worked')) $('phys-worked').innerHTML=r.worked||'';
  }

  function toast(msg,ms){
    toastEl.innerHTML=msg; toastEl.classList.add('show');
    clearTimeout(toastT); toastT=setTimeout(function(){toastEl.classList.remove('show');},ms||5600);
  }

  /* ---- Guided Inquiry pause: while the inquiry cards are on screen, "See it in the
     sim" would jump the scene past the card and its toast would state gated answers. */
  var giNote=backdrop.querySelector('.phys-gi-note');
  function giActive(){ var c=$('inq-cards'); return !!(c&&c.offsetParent); }
  function syncGi(){
    var on=giActive();
    giNote.hidden=!on;
    Array.prototype.forEach.call(art.querySelectorAll('.seesim'),function(b){
      b.setAttribute('aria-disabled',on?'true':'false');
      b.style.opacity=on?'0.45':''; b.style.cursor=on?'not-allowed':'';
      b.title=on?'Paused during the Guided Inquiry':'';
    });
  }

  /* ---- open / close ---- */
  window.__openPhysics=function(){
    refreshLive(); syncGi();
    wasPlaying=!!(window.Shell&&Shell.playing);
    if(window.Shell&&Shell.setPlaying) Shell.setPlaying(false);
    backdrop.classList.add('open');
    $('phys-close').focus();
  };
  function closePhys(restorePlay){
    if(!backdrop.classList.contains('open')) return;
    backdrop.classList.remove('open');
    if(window.Shell&&Shell.setPlaying) Shell.setPlaying(restorePlay!==undefined?restorePlay:wasPlaying);
    var b=$('toggle-formal'); if(b) b.focus();
  }
  $('phys-close').addEventListener('click',function(){closePhys();});
  backdrop.addEventListener('click',function(e){ if(e.target===backdrop) closePhys(); });
  /* capture: the shell's own Escape (leave Maximize, close Info) must not also fire */
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&backdrop.classList.contains('open')){ e.stopImmediatePropagation(); e.preventDefault(); closePhys(); }
  },true);

  /* ---- "See it in the sim": the sheet drives the simulation ---- */
  Array.prototype.forEach.call(art.querySelectorAll('.seesim'),function(btn){
    btn.addEventListener('click',function(){
      if(giActive()){ syncGi(); toast('Paused during the Guided Inquiry. Finish the inquiry or switch to Free Exploration to use this.',3200); return; }
      var s=SHOW(readVals())[btn.getAttribute('data-show')], H=window.__physicsHooks;
      if(!s||!H||!H.scene) return;
      /* in the Controls Guide, step out to Free Exploration first so the tour's veils lift */
      var nav=document.querySelector('.cg-nav');
      if(nav&&nav.style.display==='flex'&&window.__setMode) window.__setMode('free');
      closePhys(false);
      H.scene(s.scene||{});
      refreshLive();
      if(s.msg) toast(s.msg);
    });
  });

  /* ---- Download: the sheet IS the article — clone it, freeze the live panel ---- */
  var SHEET_CSS=''
    +':root{--bg:#fbfaf7;--ink:#1c2b2e;--mut:#54666a;--soft:#8a938f;--line:#e4e1d8;--acc:#217c71;--acc-soft:#bcd9d4;--tint:rgba(33,124,113,.07);--card:#ffffff;}'
    +'html[data-theme="dark"]{--bg:#0b1416;--ink:#e2e8f0;--mut:#a7b6b9;--soft:#77878a;--line:#20363a;--acc:#4db3a5;--acc-soft:#23524b;--tint:rgba(77,179,165,.10);--card:#101d20;}'
    +'body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.6 "DM Sans",-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .2s,color .2s;}'
    +'main{max-width:730px;margin:0 auto;padding:40px 26px 64px;}'
    +'.hd{display:flex;align-items:flex-end;gap:12px;border-bottom:2px solid var(--acc);padding-bottom:16px;}'
    +'.hd h1{margin:0;flex:1;font:700 30px/1.1 "STIX Two Text",Georgia,"Times New Roman",serif;}'
    +'.hd small{display:block;font-size:12.5px;font-weight:400;color:var(--mut);margin-top:7px;font-family:"DM Sans",sans-serif;}'
    +'#theme{font:inherit;font-size:16px;line-height:1;padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;}'
    +'.lede{margin:18px 0 12px;padding:13px 16px;border:1px solid var(--acc-soft);border-left:3px solid var(--acc);border-radius:0 11px 11px 0;background:var(--card);font:italic 500 16.5px/1.5 "STIX Two Text",Georgia,serif;color:var(--mut);}'
    +'.snap{margin:0 0 6px;padding:11px 15px;background:var(--tint);border-left:3px solid var(--acc);border-radius:0 8px 8px 0;font-size:13px;}'
    +'.ch{display:grid;grid-template-columns:42px 1fr;gap:0 14px;padding:17px 18px 15px;margin:14px 0;border:1px solid var(--line);border-radius:11px;background:var(--card);}'
    +'.ch .no{font:600 20px/1.15 "STIX Two Text",Georgia,serif;color:var(--acc);padding-top:3px;}'
    +'.ch h3{margin:0 0 12px;padding-bottom:9px;border-bottom:1px solid var(--line);font:600 19px/1.3 "STIX Two Text",Georgia,serif;color:var(--ink);}'
    +'.pts{margin:8px 0 0;padding-left:17px;font-size:13.5px;line-height:1.62;color:var(--mut);}'
    +'.pts li{margin:5px 0;}.pts b,.pts i{color:var(--ink);}'
    +'.board{border-left:3px solid var(--acc);background:var(--tint);border-radius:0 8px 8px 0;padding:12px 14px 10px;margin:10px 0;overflow-x:auto;color:var(--ink);}'
    +'.board svg{display:block;}'
    +'.board .cap,.fig .cap{font-size:11.5px;color:var(--soft);margin-top:8px;}'
    +'.fig{margin:12px 0 6px;padding:12px 10px 9px;border:1px solid var(--line);border-radius:9px;color:var(--ink);text-align:center;}'
    +'.fig svg{width:100%;height:auto;display:inline-block;}'
    +'.fig.f1 svg{max-width:440px;}.fig.f2 svg{max-width:360px;}.fig.f3 svg{max-width:400px;}'
    +'.phys-q{border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13.5px;color:var(--mut);}'
    +'.phys-q+.phys-q{margin-top:8px;}'
    +'.phys-q summary{cursor:pointer;color:var(--ink);font-weight:600;}'
    +'.phys-q[open]{border-color:var(--acc-soft);}'
    +'.phys-q .ans{margin:7px 0 0;line-height:1.55;}'
    +'.bar{margin-top:26px;display:flex;gap:12px;align-items:center;}'
    +'.bar button{font:inherit;padding:9px 18px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer;}'
    +'.foot{font-size:12px;color:var(--soft);}'
    +'@media print{.bar,#theme{display:none;}body{background:#fff;}:root{--bg:#fff;--ink:#111;--mut:#3c4a4d;--soft:#666;--line:#ddd;--acc:#14524a;--acc-soft:#9cc;--tint:#f0f5f4;}.ch{break-inside:avoid;}}';

  $('phys-download').addEventListener('click',function(){
    var r=LIVE(readVals())||{};
    var d=new Date().toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
    var c=art.cloneNode(true);
    Array.prototype.forEach.call(c.querySelectorAll('.seesim'),function(b){b.remove();});
    var live=c.querySelector('#phys-live');
    if(live){
      var p=document.createElement('div'); p.className='snap';
      p.innerHTML='Your snapshot when you saved this: '+(r.snap||r.num||'');
      live.parentNode.replaceChild(p,live);
    }
    var html='<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">'
      +'<meta name="viewport" content="width=device-width,initial-scale=1">'
      +'<title>The Physics — '+TITLE+'</title>'
      +'<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;0,700;1,500&display=swap">'
      +'<style>'+SHEET_CSS+'</style></head><body><main>'
      +'<div class="hd"><h1>The Physics<small>'+TITLE+' · revision sheet · saved '+d+'</small></h1>'
      +'<button id="theme" title="Switch light / dark">☾</button></div>'
      +c.innerHTML
      +'<div class="bar"><button id="printer">🖨 Print / save as PDF</button>'
      +'<span class="foot">Printing reveals the self-test answers. Equations and diagrams work fully offline.</span></div>'
      +'</main><script>'
      +'document.getElementById("theme").addEventListener("click",function(){'
      +'var r=document.documentElement,dk=r.getAttribute("data-theme")==="dark";'
      +'r.setAttribute("data-theme",dk?"light":"dark");this.textContent=dk?"\\u263E":"\\u2600";});'
      +'document.getElementById("printer").addEventListener("click",function(){'
      +'document.querySelectorAll("details").forEach(function(x){x.open=true;});window.print();});'
      +'<\/script><\/body><\/html>';
    (async function(){
      var ok=false;
      try{
        if(window.claude&&window.claude.use){
          var dl=await window.claude.use('downloads');
          if(dl){ await dl.save({filename:FILE, data:html}); ok=true; }
        }
      }catch(err){
        if(err&&err.code==='declined') return;
        if(err&&err.code==='rate_limited'){ toast('One save prompt at a time — try again in a moment.'); return; }
      }
      if(!ok){
        try{
          var blob=new Blob([html],{type:'text/html'});
          var a=document.createElement('a');
          a.href=URL.createObjectURL(blob); a.download=FILE;
          document.body.appendChild(a); a.click();
          setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},400);
        }catch(e2){ toast('Could not save the sheet in this view.'); return; }
      }
      toast('<b>Sheet saved.</b> Same chapters, equations and diagrams — with its own light/dark switch and a print button that turns it into a PDF.');
    })();
  });
})();
</script>
